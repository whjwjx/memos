syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "gen/api/v1";

service AIService {
  // Transcribe transcribes an audio file using an instance AI provider.
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:transcribe"
      body: "*"
    };
    option (google.api.method_signature) = "audio";
  }

  // TestAIProvider verifies that an instance AI provider can reach its chat
  // model endpoint and authenticate. Returns the provider's reply so the
  // caller can confirm end-to-end connectivity.
  rpc TestAIProvider(TestAIProviderRequest) returns (TestAIProviderResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai/providers:test"
      body: "*"
    };
    option (google.api.method_signature) = "provider_id,model";
  }

  // Translate translates text between English and Chinese using the configured
  // instance AI translation provider.
  rpc Translate(TranslateRequest) returns (TranslateResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:translate"
      body: "*"
    };
    option (google.api.method_signature) = "text,direction";
  }

  // ListTranslationHistories lists the current user's translation history.
  rpc ListTranslationHistories(ListTranslationHistoriesRequest) returns (ListTranslationHistoriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/ai/translation-histories"
    };
  }

  // DeleteTranslationHistory deletes one translation history item owned by the
  // current user.
  rpc DeleteTranslationHistory(DeleteTranslationHistoryRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/ai/translation-histories/{id}"
    };
    option (google.api.method_signature) = "id";
  }

  // ClearTranslationHistories deletes all translation history items owned by
  // the current user.
  rpc ClearTranslationHistories(ClearTranslationHistoriesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/ai/translation-histories"
    };
  }
}

message TranscribeRequest {
  // Required. Audio input.
  TranscriptionAudio audio = 1 [(google.api.field_behavior) = REQUIRED];
}

message TranscriptionAudio {
  oneof source {
    // Inline audio bytes.
    bytes content = 1 [(google.api.field_behavior) = INPUT_ONLY];

    // URI for audio content. Reserved for future use.
    string uri = 2;
  }

  // Optional. The uploaded filename.
  string filename = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The MIME type of the input audio.
  string content_type = 4 [(google.api.field_behavior) = OPTIONAL];
}

message TranscribeResponse {
  // The transcribed text.
  string text = 1;
}

message TestAIProviderRequest {
  // Required. The instance AI provider ID to test.
  string provider_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The provider-specific model id to use for the probe. If omitted,
  // the provider's default chat model is used.
  string model = 2 [(google.api.field_behavior) = OPTIONAL];
}

message TestAIProviderResponse {
  // True when the provider answered with a non-empty reply.
  bool ok = 1;

  // The provider's reply text, if any. Useful for confirming the round trip.
  string reply = 2;

  // Error message when ok is false; empty otherwise.
  string error = 3;
}

enum TranslationDirection {
  TRANSLATION_DIRECTION_UNSPECIFIED = 0;
  // AUTO asks the server to infer English-to-Chinese or Chinese-to-English.
  AUTO = 1;
  EN_TO_ZH = 2;
  ZH_TO_EN = 3;
}

message TranslateRequest {
  // Required. Text to translate.
  string text = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Translation direction. Defaults to AUTO.
  TranslationDirection direction = 2 [(google.api.field_behavior) = OPTIONAL];
}

message TranslateResponse {
  string translated_text = 1;
  string source_language = 2;
  string target_language = 3;
  TranslationHistory history = 4;
}

message TranslationHistory {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string source_text = 3;
  string translated_text = 4;
  string source_language = 5;
  string target_language = 6;
  int64 create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListTranslationHistoriesRequest {
  // Maximum number of records to return. Defaults to 50.
  int32 page_size = 1;

  // A page token from a previous response.
  string page_token = 2;
}

message ListTranslationHistoriesResponse {
  repeated TranslationHistory histories = 1;
  string next_page_token = 2;
}

message DeleteTranslationHistoryRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ClearTranslationHistoriesRequest {}
