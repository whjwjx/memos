syntax = "proto3";

package memos.store;

import "google/type/color.proto";

option go_package = "gen/store";

enum InstanceSettingKey {
  INSTANCE_SETTING_KEY_UNSPECIFIED = 0;
  // BASIC is the key for basic settings.
  BASIC = 1;
  // GENERAL is the key for general settings.
  GENERAL = 2;
  // STORAGE is the key for storage settings.
  STORAGE = 3;
  // MEMO_RELATED is the key for memo related settings.
  MEMO_RELATED = 4;
  // TAGS is the key for tag metadata.
  TAGS = 5;
  // NOTIFICATION is the key for notification transport settings.
  NOTIFICATION = 6;
  // AI is the key for AI provider settings.
  AI = 7;
  // LOG is the key for server log retention settings.
  LOG = 8;
}

message InstanceSetting {
  InstanceSettingKey key = 1;
  oneof value {
    InstanceBasicSetting basic_setting = 2;
    InstanceGeneralSetting general_setting = 3;
    InstanceStorageSetting storage_setting = 4;
    InstanceMemoRelatedSetting memo_related_setting = 5;
    InstanceTagsSetting tags_setting = 6;
    InstanceNotificationSetting notification_setting = 7;
    InstanceAISetting ai_setting = 8;
    InstanceLogSetting log_setting = 9;
  }
}

message InstanceBasicSetting {
  // The secret key for instance. Mainly used for session management.
  string secret_key = 1;
  // The current schema version of database.
  string schema_version = 2;
}

message InstanceGeneralSetting {
  // disallow_user_registration disallows user registration.
  bool disallow_user_registration = 2;
  // disallow_password_auth disallows password authentication.
  bool disallow_password_auth = 3;
  // additional_script is the additional script.
  string additional_script = 4;
  // additional_style is the additional style.
  string additional_style = 5;
  // custom_profile is the custom profile.
  InstanceCustomProfile custom_profile = 6;
  // week_start_day_offset is the week start day offset from Sunday.
  // 0: Sunday, 1: Monday, 2: Tuesday, 3: Wednesday, 4: Thursday, 5: Friday, 6: Saturday
  // Default is Sunday.
  int32 week_start_day_offset = 7;
  // disallow_change_username disallows changing username.
  bool disallow_change_username = 8;
  // disallow_change_nickname disallows changing nickname.
  bool disallow_change_nickname = 9;
}

message InstanceCustomProfile {
  string title = 1;
  string description = 2;
  string logo_url = 3;
}

enum StorageType {
  STORAGE_TYPE_UNSPECIFIED = 0;
  // DATABASE stores attachment content in the application database.
  STORAGE_TYPE_DATABASE = 1;
  // LOCAL stores attachment content on the local filesystem.
  STORAGE_TYPE_LOCAL = 2;
  // S3 stores attachment content in an S3-compatible object store.
  STORAGE_TYPE_S3 = 3;
}

// Storage is a configured attachment storage instance.
message Storage {
  // id is the stable identifier referenced by attachments.
  string id = 1;
  // name is the human-readable storage name.
  string name = 2;
  StorageType type = 3;

  oneof config {
    StorageS3Config s3_config = 10;
  }
}

message InstanceStorageSetting {
  // Legacy storage type enum retained for compatibility with existing settings.
  enum StorageType {
    STORAGE_TYPE_UNSPECIFIED = 0;
    // STORAGE_TYPE_DATABASE is the database storage type.
    DATABASE = 1;
    // STORAGE_TYPE_LOCAL is the local storage type.
    LOCAL = 2;
    // STORAGE_TYPE_S3 is the S3 storage type.
    S3 = 3;
  }
  // Legacy compatibility field. New code uses default_storage_id.
  StorageType storage_type = 1;
  // The template of file path.
  // e.g. assets/{timestamp}_{filename}
  string filepath_template = 2;
  // The max upload size in megabytes.
  int64 upload_size_limit_mb = 3;
  // Legacy compatibility field. New code uses storages.
  StorageS3Config s3_config = 4;
  // storages contains configured storage instances, including inactive instances
  // that may still be referenced by existing attachments.
  repeated Storage storages = 5;
  // default_storage_id identifies the storage used for new attachments.
  string default_storage_id = 6;
}

// Reference: https://developers.cloudflare.com/r2/examples/aws/aws-sdk-go/
message StorageS3Config {
  string access_key_id = 1;
  string access_key_secret = 2;
  string endpoint = 3;
  string region = 4;
  string bucket = 5;
  bool use_path_style = 6;
  // insecure_skip_tls_verify disables TLS certificate verification when connecting
  // to the S3 endpoint. Only enable this for trusted endpoints that use a self-signed
  // certificate; it removes protection against man-in-the-middle attacks.
  bool insecure_skip_tls_verify = 7;
}

message InstanceMemoRelatedSetting {
  reserved 2;
  reserved "display_with_update_time";
  // content_length_limit is the limit of content length. Unit is byte.
  int32 content_length_limit = 3;
  // enable_double_click_edit enables editing on double click.
  bool enable_double_click_edit = 4;
  // reactions is the list of reactions.
  repeated string reactions = 7;
}

message InstanceTagMetadata {
  // Optional background color for the tag label.
  // When unset, the default tag color is used.
  google.type.Color background_color = 1;
  // Whether memos with this tag should have their content blurred.
  bool blur_content = 2;
}

// Active tag metadata is stored in per-user tag settings.
// This message remains for backward compatibility with existing clients and migrations.
message InstanceTagsSetting {
  // Map of tag name pattern to tag metadata.
  // Each key is treated as an anchored regular expression (^pattern$),
  // so a single entry like "project/.*" matches all tags under that prefix.
  // Exact tag names are also valid (they are trivially valid regex patterns).
  map<string, InstanceTagMetadata> tags = 1;
}

message InstanceNotificationSetting {
  EmailSetting email = 1;

  message EmailSetting {
    bool enabled = 1;
    string smtp_host = 2;
    int32 smtp_port = 3;
    string smtp_username = 4;
    string smtp_password = 5;
    string from_email = 6;
    string from_name = 7;
    string reply_to = 8;
    bool use_tls = 9;
    bool use_ssl = 10;
  }
}

message InstanceAISetting {
  // providers is the list of AI provider configurations available instance-wide.
  repeated AIProviderConfig providers = 1;

  // transcription is the speech-to-text feature configuration.
  // When unset or transcription.provider_id is empty, transcription is disabled.
  TranscriptionConfig transcription = 2;

  // agents is the list of AI agents that can automatically reply to memos.
  // Each agent is backed by a provider and a personality prompt. When empty,
  // the agent-reply feature is disabled.
  repeated AIAgentConfig agents = 3;

  // taggers is the list of AI auto-tagging rules. A tagger is the tagging
  // capability instance of the Agent system: it is backed by a provider and a
  // tagging prompt, and applies #tags to memos. Configured instance-wide by an
  // admin; regular users only consume them. When empty, the auto-tagging
  // feature is disabled.
  repeated TaggerConfig taggers = 4;

  // chat_agents is the list of conversational assistant presets surfaced in the
  // /ai-chat page. Stage 1 uses only the first enabled preset as the default
  // assistant; a second enabled preset triggers the agent selector in the UI.
  // Backed by a provider and a system prompt. When empty, /ai-chat shows a
  // "no assistant configured" empty state.
  repeated ChatAgentConfig chat_agents = 5;

  // tools is the per-tool toggle and safety configuration for the conversational
  // assistant. The key is the tool name (e.g. "query_db"). Admin controls enable
  // and whether a tool requires a confirmation card before executing. The
  // built-in tool set is fixed; admin may only enable/disable and mark sensitive.
  map<string, ToolConfig> tools = 6;

  // memory is the instance-wide shared context bank for the conversational
  // assistant. When enabled, its entries are injected into every chat
  // conversation's system prompt. Managed by the admin through the settings UI
  // and by the admin-only manage_memory tool.
  MemoryConfig memory = 7;
}

// MemoryConfig holds the shared context bank used by the AI chat assistant.
message MemoryConfig {
  // enabled controls whether the shared memory is injected into chat.
  bool enabled = 1;

  // entries is the list of shared memory items. It is bounded to tens of items
  // and stored inline in the AI instance setting.
  repeated MemoryEntry entries = 2;
}

// MemoryEntry is a single item in the shared memory bank.
message MemoryEntry {
  // id is a stable identifier for the entry.
  string id = 1;
  // content is the memory text injected into chat conversations.
  string content = 2;
  // created_by is the account that created the entry.
  string created_by = 3;
  // created_ts is the unix timestamp (seconds) of creation.
  int64 created_ts = 4;
  // updated_ts is the unix timestamp (seconds) of the last modification.
  int64 updated_ts = 5;
}

// ChatAgentConfig describes a conversational assistant preset for the /ai-chat
// page. It is a prompt + provider binding with an authorized tool set. Multiple
// presets are admin extensions that differ only in system prompt and capability
// scope; they are NOT separate agent runtimes.
message ChatAgentConfig {
  // id is the stable identifier of the preset.
  string id = 1;
  // name is the human-readable preset name shown in the selector (stage 2+).
  string name = 2;
  // builtin marks a preset shipped with memos. Built-in presets cannot be
  // deleted, but their name/system_prompt may be edited.
  bool builtin = 3;
  // provider_id references an entry in InstanceAISetting.providers[].id.
  // Empty string means the preset is disabled.
  string provider_id = 4;
  // model is the provider-specific text-generation model identifier.
  // Empty string falls back to the engine default.
  string model = 5;
  // system_prompt steers the assistant's behavior, tone, and constraints.
  string system_prompt = 6;
  // enabled toggles whether the preset is selectable in /ai-chat.
  bool enabled = 7;
}

// ToolConfig is the per-tool toggle and safety configuration stored in
// InstanceAISetting.tools, keyed by tool name.
message ToolConfig {
  // enabled controls whether the tool is exposed to any user.
  bool enabled = 1;
  // requires_confirmation marks a sensitive tool that must show a confirmation
  // card before executing (e.g. write operations).
  bool requires_confirmation = 2;
}

// AIAgentConfig describes an AI persona that posts comment-style replies to
// memos. Agents are configured instance-wide by an admin; regular users only
// consume them (their memos get replied to).
message AIAgentConfig {
  // id is the stable identifier of the agent.
  string id = 1;
  // name is the human-readable persona name shown as a suffix on replies
  // (e.g. "Edison" -> reply ends with "—— Edison").
  string name = 2;
  // provider_id references an entry in InstanceAISetting.providers[].id.
  // Empty string means the agent is disabled.
  string provider_id = 3;
  // model is the provider-specific text-generation model identifier.
  // Empty string falls back to the engine default.
  string model = 4;
  // persona_prompt defines the agent's personality, tone, and speaking style.
  string persona_prompt = 5;
  // system_prompt is an admin-controlled safety/behavior constraint applied
  // to every generation (e.g. language, length, injection-resistance).
  string system_prompt = 6;
  // enabled toggles whether the agent replies to new memos.
  bool enabled = 7;
  // delay_minutes is how long to wait after a memo is created before the
  // agent replies. 0 means reply immediately. Defaults to 5 when unset.
  int32 delay_minutes = 8;
  // max_length caps the generated reply length (in characters) sent to the
  // model as a soft limit. 0 means the model default is used.
  int32 max_length = 9;
}

// TaggerConfig describes an AI auto-tagging rule. It is the tagging capability
// instance of the Agent system: an admin configures taggers instance-wide and
// regular users only consume them (their memos get auto-tagged). Tagging is
// additive — applied tags are appended to the memo content and never overwrite
// user-authored tags.
message TaggerConfig {
  // id is the stable identifier of the tagger (uuid).
  string id = 1;
  // name is the human-readable name shown in the admin UI.
  string name = 2;
  // provider_id references an entry in InstanceAISetting.providers[].id.
  // Empty string means the tagger is disabled.
  string provider_id = 3;
  // model is the provider-specific text-generation model identifier.
  // Empty string falls back to the engine default.
  string model = 4;
  // prompt is the tagging spec: the candidate tag list and selection rules.
  // This is where the tag taxonomy is delivered to the AI.
  string prompt = 5;
  // enabled toggles whether the tagger acts on new or triggered memos.
  bool enabled = 6;
  // max_tags caps how many tags are applied per memo (default 3, 0 = default).
  int32 max_tags = 7;
}

message AIProviderConfig {
  string id = 1;
  string title = 2;
  AIProviderType type = 3;
  string endpoint = 4;
  // api_key is write-only at the API layer and is required by the server to call providers.
  string api_key = 5;
}

enum AIProviderType {
  AI_PROVIDER_TYPE_UNSPECIFIED = 0;
  OPENAI = 1;
  GEMINI = 2;
}

// TranscriptionConfig configures the speech-to-text feature.
message TranscriptionConfig {
  // provider_id references an entry in InstanceAISetting.providers[].id.
  // Empty string means transcription is disabled.
  string provider_id = 1;

  // model is the provider-specific model identifier.
  // Empty string falls back to the engine default.
  // OPENAI examples:
  //   - whisper-1 (legacy, lower cost)
  //   - gpt-4o-transcribe, gpt-4o-mini-transcribe (higher quality)
  //   - gpt-4o-transcribe-diarize (includes speaker labels)
  // GEMINI examples:
  //   - gemini-2.5-flash (default, multimodal call)
  //   - gemini-2.5-pro
  string model = 2;

  // language is the default ISO 639-1 language hint sent to the provider.
  // Empty string lets the provider auto-detect.
  string language = 3;

  // prompt is a default spelling/vocabulary hint passed to the provider.
  // Used as the OpenAI Whisper "prompt" parameter (a soft hint that the model
  // may ignore) and folded into the Gemini generation prompt as a "Context and
  // spelling hints" block (which the LLM will treat more literally).
  string prompt = 4;
}

// InstanceLogSetting configures retention of the daily server log files under
// {data}/logs. When enabled, log files older than retention_days are pruned
// periodically while the server runs (not only at startup).
message InstanceLogSetting {
  // enabled toggles periodic log pruning. When disabled, log files are kept
  // indefinitely and only the built-in startup pruning may still remove files.
  bool enabled = 1;
  // retention_days is how many days of daily log files are kept. Files with a
  // modification time older than this are removed. Defaults to 3 when unset.
  int32 retention_days = 2;
}
