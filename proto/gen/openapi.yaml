                id:
                    readOnly: true
                    type: string
                    description: Output only. Server-assigned id.
                name:
                    readOnly: true
                    type: string
                    description: Output only. Stable resource name, e.g. "conversations/abc123".
                title:
                    type: string
                    description: The human-readable title shown in the chat list.
                agentId:
                    type: string
                    description: Optional. The chat agent preset id this conversation is bound to.
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. Unix timestamp of creation.
                updateTime:
                    readOnly: true
                    type: string
                    description: Output only. Unix timestamp of the last update.
            description: Conversation is a single AI chat session owned by a user.
        ConversationMessage:
            type: object
            properties:
                id:
                    readOnly: true
                    type: string
                    description: Output only.
                role:
                    type: string
                    description: 'Role of the author: "user", "assistant", "tool", or "system".'
                content:
                    type: string
                    description: Text content of the message. Empty when the turn is a tool call request.
                toolCalls:
                    type: array
                    items:
                        $ref: '#/components/schemas/ToolCall'
                    description: Tool calls requested by the assistant this turn (assistant turns only).
                toolCallId:
                    readOnly: true
                    type: string
                    description: |-
                        For a tool-result turn, the id of the assistant tool call this message
                         answers. Lets the client correlate results back to the originating call.
                name:
                    readOnly: true
                    type: string
                    description: For a tool-result turn, the name of the tool that produced this message.
            description: ConversationMessage is a single turn within a conversation.
        CreateConversationRequest:
            type: object
            properties:
                agentId:
                    type: string
