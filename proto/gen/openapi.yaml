        InstanceLogStats:
            type: object
            properties:
                fileCount:
                    type: integer
                    description: file_count is the number of memos-*.log files present.
                    format: int32
                totalBytes:
                    type: string
                    description: total_bytes is the combined size of those files in bytes.
            description: Statistics about the server log files under {data}/logs.
        InstanceProfile:
            type: object
            properties:
                version:
                    type: string
                    description: Version is the current version of instance.
                demo:
                    type: boolean
                    description: Demo indicates if the instance is in demo mode.
                instanceUrl:
                    type: string
                    description: Instance URL is the URL of the instance.
                admin:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: |-
                        The first administrator who set up this instance, for display purposes.
                         May be null on an instance that has lost all admins; use needs_setup to
                         determine whether initial setup is actually required.
                commit:
                    type: string
                    description: Commit is the current build commit of instance.
                needsSetup:
                    type: boolean
                    description: |-
                        NeedsSetup is true when the instance has no users yet and requires initial
                         setup (creating the first admin account). Unlike a null admin, this stays
                         false once any user exists, so an instance that has lost its admins is not
                         mistaken for a fresh install.
            description: Instance profile message containing basic instance information.
        InstanceSetting:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the instance setting.
                         Format: instance/settings/{setting}
                generalSetting:
                    $ref: '#/components/schemas/InstanceSetting_GeneralSetting'
                storageSetting:
                    $ref: '#/components/schemas/InstanceSetting_StorageSetting'
                memoRelatedSetting:
                    $ref: '#/components/schemas/InstanceSetting_MemoRelatedSetting'
                tagsSetting:
                    $ref: '#/components/schemas/InstanceSetting_TagsSetting'
                notificationSetting:
                    $ref: '#/components/schemas/InstanceSetting_NotificationSetting'
                aiSetting:
                    $ref: '#/components/schemas/InstanceSetting_AISetting'
                logSetting:
                    $ref: '#/components/schemas/LogSetting'
            description: An instance setting resource.
        InstanceSetting_AIProviderConfig:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                type:
                    enum:
                        - AI_PROVIDER_TYPE_UNSPECIFIED
                        - OPENAI
                        - GEMINI
                    type: string
                    format: enum
                endpoint:
                    type: string
                apiKey:
                    writeOnly: true
                    type: string
                    description: api_key is write-only and is never returned by GetInstanceSetting.
                apiKeySet:
                    readOnly: true
                    type: boolean
                    description: api_key_set indicates whether an API key is stored for this provider.
                apiKeyHint:
                    readOnly: true
                    type: string
                    description: api_key_hint is a masked hint for the stored API key.
            description: AIProviderConfig represents one callable AI provider connection.
        InstanceSetting_AISetting:
            type: object
            properties:
                providers:
                    type: array
                    items:
                        $ref: '#/components/schemas/InstanceSetting_AIProviderConfig'
                    description: providers is the list of AI provider configurations available instance-wide.
                transcription:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_TranscriptionConfig'
                    description: |-
                        transcription is the speech-to-text feature configuration.
                         When unset or transcription.provider_id is empty, transcription is disabled.
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/InstanceSetting_AgentConfig'
                    description: agents is the list of AI agents that can automatically reply to memos.
                taggers:
                    type: array
                    items:
                        $ref: '#/components/schemas/InstanceSetting_TaggerConfig'
                    description: |-
                        taggers is the list of AI auto-tagging rules. A tagger is the tagging
                         capability instance of the Agent system, applied instance-wide by an
                         admin. When empty, the auto-tagging feature is disabled.
                chatAgents:
                    type: array
                    items:
                        $ref: '#/components/schemas/InstanceSetting_ChatAgentConfig'
                    description: |-
                        chat_agents is the list of conversational assistant presets surfaced in the
                         /ai-chat page. Stage 1 uses only the first enabled preset as the default
                         assistant; a second enabled preset triggers the agent selector in the UI.
                tools:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/InstanceSetting_ToolConfig'
                    description: |-
                        tools is the per-tool toggle and safety configuration for the conversational
                         assistant, keyed by tool name (e.g. "query_db"). Admin controls enable and
                         whether a tool requires a confirmation card before executing.
                memory:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_MemoryConfig'
                    description: |-
                        memory is the instance-wide shared context bank for the conversational
                         assistant. When enabled, its entries are injected into every chat
                         conversation's system prompt. Managed by the admin through the settings UI
                         and by the admin-only manage_memory tool.
                translation:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_TranslationConfig'
                    description: |-
                        translation is the admin-configured AI translation capability surfaced in
                         the /translate page. Non-admin callers can only see whether it is enabled.
            description: AI provider configuration settings.
        InstanceSetting_AgentConfig:
            type: object
            properties:
                id:
                    type: string
                    description: id is the stable identifier of the agent.
                name:
                    type: string
                    description: name is the human-readable persona name shown as a suffix on replies.
                providerId:
                    type: string
                    description: provider_id references an entry in AISetting.providers[].id.
                model:
                    type: string
                    description: model is the provider-specific text-generation model identifier.
                personaPrompt:
                    type: string
                    description: persona_prompt defines the agent's personality, tone, and speaking style.
                systemPrompt:
                    type: string
                    description: system_prompt is an admin-controlled safety/behavior constraint.
                enabled:
                    type: boolean
                    description: enabled toggles whether the agent replies to new memos.
                delayMinutes:
                    type: integer
                    description: |-
                        delay_minutes is how long to wait after a memo is created before the
                         agent replies. 0 means reply immediately. Defaults to 5 when unset.
                    format: int32
                maxLength:
                    type: integer
                    description: max_length caps the generated reply length (in characters).
                    format: int32
            description: |-
                AgentConfig describes an AI persona that posts comment-style replies to
                 memos. Configured instance-wide by an admin; regular users only consume them.
        InstanceSetting_ChatAgentConfig:
            type: object
            properties:
                id:
                    type: string
                    description: id is the stable identifier of the preset.
                name:
                    type: string
                    description: name is the human-readable preset name shown in the selector (stage 2+).
                builtin:
                    type: boolean
                    description: |-
                        builtin marks a preset shipped with memos. Built-in presets cannot be
                         deleted, but their name/system_prompt may be edited.
                providerId:
                    type: string
                    description: |-
                        provider_id references an entry in AISetting.providers[].id.
                         Empty string means the preset is disabled.
                model:
                    type: string
                    description: |-
                        model is the provider-specific text-generation model identifier.
                         Empty string falls back to the engine default.
                systemPrompt:
                    type: string
                    description: system_prompt steers the assistant's behavior, tone, and constraints.
                enabled:
                    type: boolean
                    description: enabled toggles whether the preset is selectable in /ai-chat.
            description: |-
                ChatAgentConfig describes a conversational assistant preset for the /ai-chat
                 page. It is a prompt + provider binding with an authorized tool set. Multiple
                 presets are admin extensions that differ only in system prompt and capability
                 scope; they are NOT separate agent runtimes.
