            description: Metadata for a tag.
        InstanceSetting_TaggerConfig:
            type: object
            properties:
                id:
                    type: string
                    description: id is the stable identifier of the tagger (uuid).
                name:
                    type: string
                    description: name is the human-readable name shown in the admin UI.
                providerId:
                    type: string
                    description: provider_id references an entry in AISetting.providers[].id.
                model:
                    type: string
                    description: model is the provider-specific text-generation model identifier.
                prompt:
                    type: string
                    description: 'prompt is the tagging spec: the candidate tag list and selection rules.'
                enabled:
                    type: boolean
                    description: enabled toggles whether the tagger acts on new or triggered memos.
                maxTags:
                    type: integer
                    description: max_tags caps how many tags are applied per memo (default 3, 0 = default).
                    format: int32
            description: |-
                TaggerConfig describes an AI auto-tagging rule. It is the tagging
