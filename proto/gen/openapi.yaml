                - providerId
            type: object
            properties:
                providerId:
                    type: string
                    description: Required. The instance AI provider ID to test.
                model:
                    type: string
                    description: |-
                        Optional. The provider-specific model id to use for the probe. If omitted,
                         the provider's default chat model is used.
        TestAIProviderResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    description: True when the provider answered with a non-empty reply.
                reply:
                    type: string
                    description: The provider's reply text, if any. Useful for confirming the round trip.
                error:
                    type: string
                    description: Error message when ok is false; empty otherwise.
        TestInstanceEmailSettingRequest:
            type: object
            properties:
                email:
                    allOf:
                        - $ref: '#/components/schemas/NotificationSetting_EmailSetting'
                    description: Optional. SMTP email settings to test. If omitted, the stored notification email setting is used.
                recipientEmail:
                    type: string
                    description: Optional. Recipient email address. If omitted, the current user's email address is used.
            description: Request message for TestInstanceEmailSetting method.
        ToolApproval:
            type: object
            properties:
                toolCallId:
                    type: string
                    description: Id of the assistant tool call being approved.
                confirmKeyword:
                    type: string
                    description: Keyword the user typed to confirm, e.g. "yes".
            description: |-
                ToolApproval carries the user's explicit confirmation for a sensitive tool
                 call that was gated behind a second confirmation step.
        ToolCall:
            type: object
            properties:
                id:
                    type: string
                    description: Unique id correlating the call with its result message.
                name:
                    type: string
                    description: The tool (function) name.
                arguments:
                    type: string
                    description: JSON-encoded arguments for the call.
                result:
                    type: string
                    description: Present on the tool result message answering this call.
                requiresConfirmation:
                    type: boolean
                    description: True when the tool requires user confirmation before executing.
            description: ToolCall is a single function call the assistant requested.
        TranscribeRequest:
            required:
                - audio
            type: object
            properties:
                audio:
                    allOf:
                        - $ref: '#/components/schemas/TranscriptionAudio'
                    description: Required. Audio input.
        TranscribeResponse:
            type: object
            properties:
                text:
                    type: string
                    description: The transcribed text.
        TranscriptionAudio:
            type: object
            properties:
                content:
                    writeOnly: true
                    type: string
                    description: Inline audio bytes.
                    format: bytes
                uri:
                    type: string
                    description: URI for audio content. Reserved for future use.
                filename:
                    type: string
                    description: Optional. The uploaded filename.
                contentType:
                    type: string
                    description: Optional. The MIME type of the input audio.
        TranslateRequest:
            required:
                - text
            type: object
            properties:
                text:
                    type: string
                    description: Required. Text to translate.
                direction:
                    enum:
                        - TRANSLATION_DIRECTION_UNSPECIFIED
                        - AUTO
                        - EN_TO_ZH
                        - ZH_TO_EN
                    type: string
                    description: Optional. Translation direction. Defaults to AUTO.
                    format: enum
        TranslateResponse:
            type: object
            properties:
                translatedText:
                    type: string
                sourceLanguage:
                    type: string
                targetLanguage:
                    type: string
                history:
                    $ref: '#/components/schemas/TranslationHistory'
        TranslationHistory:
            type: object
            properties:
                id:
                    readOnly: true
                    type: string
                name:
                    readOnly: true
                    type: string
                sourceText:
                    type: string
                translatedText:
                    type: string
                sourceLanguage:
                    type: string
                targetLanguage:
                    type: string
                createTime:
                    readOnly: true
                    type: string
        UpdateConversationRequest:
            required:
                - conversation
            type: object
            properties:
                conversation:
                    allOf:
                        - $ref: '#/components/schemas/Conversation'
                    description: Required. The conversation to update, identified by id (or name).
                updateMask:
                    type: string
                    description: Fields to update (currently only title is honored).
                    format: field-mask
        UpsertMemoReactionRequest:
            required:
                - name
                - reaction
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Required. The resource name of the memo.
                         Format: memos/{memo}
                reaction:
                    allOf:
                        - $ref: '#/components/schemas/Reaction'
                    description: Required. The reaction to upsert.
        UpsertMemoScheduleOccurrenceRequest:
            required:
                - memo
                - occurrenceTime
                - status
            type: object
            properties:
                memo:
                    type: string
                    description: |-
                        Required. The scheduled memo resource name.
                         Format: memos/{memo}
                occurrenceTime:
                    type: string
                    description: Required. The occurrence time to update.
                    format: date-time
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - PENDING
                        - DONE
                    type: string
                    description: Required. The new completion state. Use PENDING to clear a previously persisted completion.
                    format: enum
        User:
            required:
                - role
                - username
                - state
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the user.
                         Format: users/{user}
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ADMIN
                        - USER
                    type: string
                    description: The role of the user.
                    format: enum
                username:
                    type: string
                    description: Required. The unique username for login.
                email:
                    type: string
                    description: Optional. The email address of the user.
                displayName:
                    type: string
                    description: Optional. The display name of the user.
                avatarUrl:
                    type: string
                    description: Optional. The avatar URL of the user.
                description:
                    type: string
                    description: Optional. The description of the user.
                password:
                    writeOnly: true
                    type: string
                    description: Input only. The password for the user.
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - NORMAL
                        - ARCHIVED
                    type: string
                    description: The state of the user.
                    format: enum
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation timestamp.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: Output only. The last update timestamp.
                    format: date-time
        UserNotification:
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The resource name of the notification.
                         Format: users/{user}/notifications/{notification}
                sender:
                    readOnly: true
                    type: string
                    description: |-
                        The sender of the notification.
                         Format: users/{user}
                senderUser:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The sender user details.
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - UNREAD
                        - ARCHIVED
                    type: string
                    description: The status of the notification.
                    format: enum
                createTime:
                    readOnly: true
                    type: string
                    description: The creation timestamp.
                    format: date-time
                type:
                    readOnly: true
                    enum:
                        - TYPE_UNSPECIFIED
                        - MEMO_COMMENT
                        - MEMO_MENTION
                    type: string
                    description: The type of the notification.
                    format: enum
                memoComment:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/UserNotification_MemoCommentPayload'
                memoMention:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/UserNotification_MemoMentionPayload'
        UserNotification_MemoCommentPayload:
            type: object
            properties:
                memo:
                    type: string
                    description: |-
                        The memo name of comment.
                         Format: memos/{memo}
                relatedMemo:
                    type: string
                    description: |-
                        The name of related memo.
                         Format: memos/{memo}
                memoSnippet:
                    type: string
                    description: Preview text of the comment memo.
                relatedMemoSnippet:
                    type: string
                    description: Preview text of the related memo.
        UserNotification_MemoMentionPayload:
            type: object
            properties:
                memo:
                    type: string
                    description: |-
                        The memo that contains the mention.
                         Format: memos/{memo}
                relatedMemo:
                    type: string
                    description: |-
                        The related parent memo when the mention was created in a comment.
                         Format: memos/{memo}
                memoSnippet:
                    type: string
                    description: Preview text of the memo that contains the mention.
                relatedMemoSnippet:
                    type: string
                    description: Preview text of the related parent memo.
        UserSetting:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the user setting.
                         Format: users/{user}/settings/{setting}, {setting} is the key for the setting.
                         For example, "users/steven/settings/GENERAL" for general settings.
                generalSetting:
                    $ref: '#/components/schemas/UserSetting_GeneralSetting'
                webhooksSetting:
                    $ref: '#/components/schemas/UserSetting_WebhooksSetting'
                tagsSetting:
                    $ref: '#/components/schemas/UserSetting_TagsSetting'
            description: User settings message
        UserSetting_GeneralSetting:
            type: object
            properties:
                locale:
                    type: string
                    description: The preferred locale of the user.
                memoVisibility:
                    type: string
                    description: The default visibility of the memo.
                theme:
                    type: string
                    description: |-
                        The preferred theme of the user.
                         This references a CSS file in the web/public/themes/ directory.
                         If not set, the default theme will be used.
                saveMediaMetadata:
                    type: boolean
                    description: Whether the official client should save metadata from future media uploads.
                calendarDayStart:
                    type: integer
                    description: |-
                        The start of the calendar day in minutes from midnight.
                         Hours before this are hidden in the calendar week view. Defaults to 0.
                    format: int32
                calendarDayEnd:
                    type: integer
                    description: |-
                        The end of the calendar day in minutes from midnight.
                         Hours after this are hidden in the calendar week view. Defaults to 1440.
                    format: int32
                showCommentPreview:
                    type: boolean
                    description: |-
                        Whether to show the first few comments under each memo in the feed.
                         When false, memo cards in the list no longer render the comment preview.
                         Defaults to true.
                commentIndicatorOnHover:
                    type: boolean
                    description: |-
                        Whether the memo card comment count indicator is only shown on hover.
                         When true, the indicator is hidden until the card is hovered. Defaults to false (always shown).
            description: General user settings configuration.
        UserSetting_TagMetadata:
            type: object
            properties:
                backgroundColor:
                    allOf:
                        - $ref: '#/components/schemas/Color'
                    description: |-
                        Optional background color for the tag label.
                         When unset, the default tag color is used.
                blurContent:
                    type: boolean
                    description: Whether memos with this tag should have their content blurred.
                pinned:
                    type: boolean
                    description: Whether this exact tag should be shown in the pinned tags section.
            description: Tag metadata for user-specific display rules.
        UserSetting_TagsSetting:
            type: object
            properties:
                tags:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/UserSetting_TagMetadata'
                    description: |-
                        Map of tag name pattern to tag metadata.
                         Each key is treated as an anchored regular expression (^pattern$).
            description: User-specific tag metadata.
        UserSetting_WebhooksSetting:
            type: object
            properties:
                webhooks:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserWebhook'
                    description: List of user webhooks.
            description: User webhooks configuration.
        UserStats:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the user statistics singleton.
                         Format: users/{user}/stats
                memoTypeStats:
                    allOf:
                        - $ref: '#/components/schemas/UserStats_MemoTypeStats'
                    description: The stats of memo types.
                tagCount:
                    type: object
                    additionalProperties:
                        type: integer
                        format: int32
                    description: The count of tags.
                memoCreatedTimestamps:
                    type: array
                    items:
                        type: string
                        format: date-time
                    description: The creation timestamps of the user's memos.
                memoUpdatedTimestamps:
                    type: array
                    items:
                        type: string
                        format: date-time
                    description: |-
                        The latest update timestamps of the user's memos (one per memo,
                         mirrors memo_created_timestamps). Used by the activity heatmap when
                         the client's view is set to update_time basis.
                pinnedMemos:
                    type: array
                    items:
                        type: string
                    description: The pinned memos of the user.
                totalMemoCount:
                    type: integer
                    description: Total memo count.
                    format: int32
            description: User statistics messages
        UserStats_MemoTypeStats:
            type: object
            properties:
                linkCount:
                    type: integer
                    format: int32
                codeCount:
                    type: integer
                    format: int32
                todoCount:
                    type: integer
                    format: int32
                undoCount:
                    type: integer
                    format: int32
            description: Memo type statistics.
        UserWebhook:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the webhook.
                         Format: users/{user}/webhooks/{webhook}
                url:
                    type: string
                    description: The URL to send the webhook to.
                displayName:
                    type: string
                    description: Optional. Human-readable name for the webhook.
                createTime:
                    readOnly: true
                    type: string
                    description: The creation time of the webhook.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: The last update time of the webhook.
                    format: date-time
                signingSecret:
                    writeOnly: true
                    type: string
                    description: |-
                        Optional. Signing secret used to HMAC-SHA256 sign the webhook request body.
                         This field is input-only; it is never returned in responses.
                signingSecretSet:
                    readOnly: true
                    type: boolean
                    description: Whether a signing secret is configured for this webhook.
            description: UserWebhook represents a webhook owned by a user.
        VideoMetadata:
            type: object
            properties:
                durationSeconds:
                    type: number
                    format: double
tags:
    - name: AIChatService
      description: |-
        AIChatService exposes the conversational AI assistant with tool-calling
         support. It is decoupled from AIService, which holds AI infrastructure
         operations such as transcription and provider probing.
    - name: AIService
    - name: AttachmentService
    - name: AuthService
    - name: IdentityProviderService
    - name: InstanceService
    - name: MemoService
    - name: MemoViewService
    - name: UserService
