                        The resource name of the memo.
                         Format: memos/{memo}
                snippet:
                    readOnly: true
                    type: string
                    description: Output only. The snippet of the memo content. Plain text only.
            description: Memo reference in relations.
        MemoScheduleOccurrence:
            required:
                - memo
                - occurrenceTime
                - status
            type: object
            properties:
                memo:
                    type: string
                    description: |-
                        The scheduled memo resource name.
                         Format: memos/{memo}
                occurrenceTime:
                    type: string
                    description: The time for this occurrence.
                    format: date-time
                scheduledDuration:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Optional. The duration for this occurrence.
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - PENDING
                        - DONE
                    type: string
                    description: The occurrence status. PENDING means no persisted completion exists.
                    format: enum
                recurring:
                    readOnly: true
                    type: boolean
                    description: Whether this occurrence was produced by a recurrence rule.
                memoDetail:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/Memo'
                    description: Output only. The memo backing this occurrence.
                completedTime:
                    readOnly: true
                    type: string
                    description: Output only. The time when this occurrence was completed.
                    format: date-time
        MemoScheduleRecurrence:
            required:
                - frequency
            type: object
            properties:
                frequency:
                    enum:
                        - FREQUENCY_UNSPECIFIED
                        - DAILY
                        - WEEKLY
                        - YEARLY
                    type: string
                    description: Required. The recurrence cadence.
                    format: enum
                daysOfWeek:
                    type: array
                    items:
                        type: integer
                        format: int32
                    description: Optional. Weekdays for weekly recurrence. Values use Sunday=0 through Saturday=6.
                interval:
                    type: integer
                    description: Optional. Repeat interval. Defaults to 1 when unset.
                    format: int32
                until:
                    type: string
                    description: Optional. Last occurrence time allowed by this rule.
                    format: date-time
                timezone:
                    type: string
                    description: Optional. IANA timezone used to expand this rule. Defaults to UTC when unset.
        MemoScheduleStats:
            required:
                - memo
            type: object
            properties:
                memo:
                    type: string
                    description: |-
                        The scheduled memo resource name.
                         Format: memos/{memo}
                expectedCount:
                    readOnly: true
                    type: integer
                    description: The number of occurrences due in the requested range.
                    format: int32
                completedCount:
                    readOnly: true
                    type: integer
                    description: The number of completed occurrences in the requested range.
                    format: int32
                missedCount:
                    readOnly: true
                    type: integer
                    description: The number of due occurrences in the range without completion.
                    format: int32
                completionRate:
                    readOnly: true
                    type: number
                    description: Completed occurrences divided by due occurrences in the requested range.
                    format: double
                currentStreak:
                    readOnly: true
                    type: integer
                    description: The current streak across scheduled days in the requested range.
                    format: int32
                longestStreak:
                    readOnly: true
                    type: integer
                    description: The longest streak across scheduled days in the requested range.
                    format: int32
                lastCompletedTime:
                    readOnly: true
                    type: string
                    description: The last completion time in the requested range.
                    format: date-time
        MemoShare:
